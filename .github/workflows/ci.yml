name: Plugin checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run package
      - name: Attest install files
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            release/*/main.js
            release/*/manifest.json
            release/*/styles.css
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: release/
